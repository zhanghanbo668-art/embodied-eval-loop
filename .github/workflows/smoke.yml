name: Smoke Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,rosbag]

      - name: Run pytest suite
        run: python -m pytest -q

      - name: Generate ROSBag2 SQLite fixture
        run: python scripts/create_rosbag2_sqlite_fixture.py

      - name: Generate ROSBag2 CDR fixtures
        run: python scripts/create_rosbag2_cdr_fixture.py

      - name: Ingest ROSBag2 SQLite fixture
        run: python -m pipelines.ingest --config configs/datasets/softrobotics_rosbag_sqlite.yaml

      - name: Ingest ROSBag2 CDR fixture
        run: python -m pipelines.ingest --config configs/datasets/softrobotics_rosbag_cdr.yaml

      - name: Ingest ROSBag2 MCAP fixture
        run: python -m pipelines.ingest --config configs/datasets/softrobotics_rosbag_mcap.yaml

      - name: Run demo
        run: python -m pipelines.demo

      - name: Validate SQLite dataset
        run: python -m pipelines.validate_dataset --dataset outputs/datasets/softrobotics_rosbag_sqlite_v1

      - name: Export LeRobot stub
        run: python -m pipelines.export_dataset --dataset outputs/datasets/softrobotics_rosbag_sqlite_v1 --format lerobot_stub

      - name: Export HDF5 packing contract
        run: python -m pipelines.export_dataset --dataset outputs/datasets/softrobotics_rosbag_sqlite_v1 --format hdf5_stub

      - name: Export reproducible split dataset view
        run: python -m pipelines.export_dataset --dataset outputs/datasets/softrobotics_rosbag_sqlite_v1 --format split_jsonl --split-ratio 0.5 --split-seed 2

      - name: Evaluate passing regression gate
        run: python -m pipelines.gate --config configs/cases/libero_regression_gate_pass.yaml

      - name: Run smoke checks
        run: python scripts/run_smoke_checks.py
